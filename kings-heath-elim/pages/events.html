<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events · Kings Heath Elim</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div id="nav-placeholder"></div>

  <section class="hero" style="min-height:auto; padding:52px 24px 44px;">
    <div class="hero-bg"></div>
    <div class="hero-pattern"></div>
    <div class="container" style="position:relative;z-index:2;">
      <div class="hero-eyebrow">What's On</div>
      <h1 style="color:white; font-size:clamp(32px,4vw,52px);">Upcoming <em style="color:var(--gold-light);">Events</em></h1>
      <p style="color:rgba(255,255,255,0.65); font-size:16px; max-width:480px; margin-top:12px;">Something for everyone — community meals, prayer nights, youth events and more.</p>
    </div>
  </section>

  <section class="section bg-cream">
    <div class="container">
      <div class="events-grid" id="events-grid"></div>
    </div>
  </section>

  <section class="section bg-white" style="padding-top:0;">
    <div class="container">
      <div style="background:var(--gold-pale); border:1px solid var(--border); border-radius:var(--radius-xl); padding:40px; text-align:center;">
        <div style="font-size:32px; margin-bottom:12px;">📅</div>
        <h3 style="margin-bottom:8px;">Want to host an event?</h3>
        <p style="color:var(--text-muted); font-size:15px; margin-bottom:20px; max-width:400px; margin-left:auto; margin-right:auto;">We'd love to hear from community groups, ministries and individuals who'd like to use our space.</p>
        <a href="contact.html" class="btn btn-primary">Get in Touch</a>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>
  <script src="../js/data.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/main.js"></script>
  <script>
    injectNav('events');
    injectFooter(false);
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('events-grid');
      if (grid) {
        grid.innerHTML = CHURCH_DATA.events.map(e => `
          <div class="event-card">
            <div class="event-date-col">
              <div class="event-date-num">${e.day}</div>
              <div class="event-date-mon">${e.month}</div>
            </div>
            <div class="event-body">
              <div class="event-type">${e.type}</div>
              <div class="event-title">${e.title}</div>
              <div class="event-detail">${e.time} · ${e.desc}</div>
            </div>
          </div>
        `).join('');
      }
    });
  </script>
</body>
</html>
